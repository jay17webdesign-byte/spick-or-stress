<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spick or Stress – Mobile</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;color:white}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start} .pill{background:#101a24c9;border:1px solid #ffffff35;border-radius:12px;padding:8px 12px;font-size:13px;backdrop-filter:blur(6px)}#status{position:absolute;top:60px;left:12px;display:flex;gap:8px;flex-wrap:wrap}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;color:#fff9}#joystick{position:absolute;left:22px;bottom:24px;width:128px;height:128px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff50;pointer-events:auto;touch-action:none}#stick{position:absolute;width:54px;height:54px;border-radius:50%;background:#d9e6efaa;border:2px solid #fff8;left:37px;top:37px}#actions{position:absolute;right:20px;bottom:22px;display:flex;gap:12px;align-items:flex-end;pointer-events:auto}button{touch-action:manipulation;border:1px solid #ffffff66;background:#172632dd;color:white;border-radius:50%;width:76px;height:76px;font-weight:700;font-size:12px;box-shadow:0 4px 14px #0005}button:active{transform:scale(.95);background:#3b647d}button.small{width:58px;height:58px}#message{position:absolute;bottom:160px;left:50%;transform:translateX(-50%);background:#101a24d9;border-radius:10px;padding:8px 14px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .25s}#pausePanel{display:none;position:absolute;inset:0;background:#07111dcc;pointer-events:auto;align-items:center;justify-content:center}#pausePanel .panel{background:#172632;border:1px solid #ffffff35;border-radius:18px;padding:24px;min-width:230px;text-align:center}#pausePanel button{border-radius:12px;width:auto;height:auto;padding:12px 20px;margin-top:10px}#rotate{display:none;position:fixed;inset:0;background:#101820;z-index:9;align-items:center;justify-content:center;text-align:center;padding:30px}@media(orientation:portrait){#rotate{display:flex}}@media(orientation:landscape){#rotate{display:none}}
</style></head><body>
<div id="rotate">📱<br><br>Bitte drehe dein iPhone oder iPad ins <b>Querformat</b>, um zu spielen.</div>
<div id="hud"><div id="top"><div class="pill"><b>SPICK OR STRESS</b> · Klausur</div><div class="pill" id="timer">90:00</div><div class="pill">☰ <span id="pauseText">Pause</span></div></div><div id="status"><div class="pill">Verdacht: <span id="sus">0</span>%</div><div class="pill">Papier: <span id="ammo">5</span></div></div><div id="cross">+</div><div id="joystick"><div id="stick"></div></div><div id="actions"><button class="small" id="pause">Ⅱ<br>PAUSE</button><button id="throw">PAPIER<br>WERFEN</button></div><div id="message"></div><div id="pausePanel"><div class="panel"><h2>Pause</h2><p>Spick or Stress</p><button id="resume">Weiter spielen</button><button id="reset">Neu starten</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ca9b3);scene.fog=new THREE.Fog(0x9ca9b3,17,38);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);camera.position.set(0,1.65,7);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);renderer.domElement.style.position='fixed';renderer.domElement.style.inset='0';renderer.domElement.style.zIndex='0';document.getElementById('hud').style.zIndex='2';
scene.add(new THREE.HemisphereLight(0xeaf4ff,0x56604e,2));const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(-4,8,5);light.castShadow=true;scene.add(light);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.82});const floor= new THREE.Mesh(new THREE.PlaneGeometry(22,18),mat(0x8e9695));floor.rotation.x=-Math.PI/2;floor.position.y=0;floor.receiveShadow=true;scene.add(floor);
function box(w,h,d,color,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
// room shell
box(22,4,.2,0xe4dfd4,0,2,-9);box(.2,4,18,0xe4dfd4,-11,2,0);box(.2,4,18,0xe4dfd4,11,2,0);box(22,4,.2,0xe4dfd4,0,2,9);box(22,.15,18,0xd1d2cd,0,4,0);
// board, whiteboard and front teacher area
box(5.4,2.1,.14,0x263c39,0,2.45,-8.85);box(5.6,.12,.25,0x8c7351,0,1.35,-8.7);box(3.1,1.7,.12,0xe5e8e6,-7.4,2.4,-8.8);box(2.2,.95,1.1,0x9d7951,0,0.48,-7.6);box(2.25,.08,1.15,0x60452f,0,1.02,-7.6);
// ceiling lights
for(let x=-8;x<=8;x+=4)for(let z=-6;z<=6;z+=5){box(2.1,.07,1.1,0xf5f3e9,x,3.92,z)}
// desks in rows, student seats
const deskMat=0x76b89a, chairMat=0x9d6c39;const desks=[];for(let row=0;row<4;row++){for(let col=-2;col<=2;col++){let x=col*2.35+(row%2)*.3,z=-5+row*2.5;if(Math.abs(x)<1.3&&z<-3)continue;box(1.5,.12,1.05,deskMat,x,.82,z);box(1.42,.06,1,0x558c76,x,.9,z);for(let dx of [-.62,.62])for(let dz of [-.4,.4])box(.07,.78,.07,0x4d504e,x+dx,.39,z+dz);desks.push({x,z})}}
function makeStudent(x,z,shirt){const g=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.26,.52,4,8),mat(shirt));body.position.y=1.25;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.19,12,10),mat(0xd6b18c));head.position.y=1.7;g.add(head);let hair=new THREE.Mesh(new THREE.SphereGeometry(.2,10,8),mat(0x38271e));hair.position.y=1.82;g.add(hair);g.position.set(x,0,z);scene.add(g);return g}desks.slice(2,9).forEach((d,i)=>makeStudent(d.x,d.z+0.55,[0x537a9a,0x8b5b66,0x6d8560,0x806a9b][i%4]));
// teacher
const teacher=new THREE.Group();const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.68,5,10),mat(0x38434b));torso.position.y=1.15;teacher.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,14,12),mat(0xcda77e));head.position.y=1.72;teacher.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.24,12,8),mat(0x45352b));hair.position.y=1.85;teacher.add(hair);teacher.position.set(1.3,0,-6.3);scene.add(teacher);
let yaw=0,pitch=0,moveX=0,moveY=0,paused=false,seconds=5400,suspicion=0,ammo=5;const clock=new THREE.Clock();let balls=[];function show(msg){const el=document.getElementById('message');el.textContent=msg;el.style.opacity=1;clearTimeout(show.t);show.t=setTimeout(()=>el.style.opacity=0,1900)}
function updateCam(){camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}updateCam();
// joystick
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');let joyOn=false,joyRect;joy.addEventListener('pointerdown',e=>{joyOn=true;joy.setPointerCapture(e.pointerId);joyRect=joy.getBoundingClientRect();joyMove(e)});joy.addEventListener('pointermove',e=>{if(joyOn)joyMove(e)});function joyMove(e){let cx=joyRect.left+joyRect.width/2,cy=joyRect.top+joyRect.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=42,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}stick.style.transform=`translate(${dx}px,${dy}px)`;moveX=dx/max;moveY=-dy/max}function joyEnd(){joyOn=false;moveX=moveY=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
// touch swipe camera right side, desktop mouse too
let lookOn=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.42){lookOn=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(lookOn){yaw-=(e.clientX-lastX)*.0045;pitch-=(e.clientY-lastY)*.004;pitch=Math.max(-1.25,Math.min(1.25,pitch));lastX=e.clientX;lastY=e.clientY;updateCam()}});renderer.domElement.addEventListener('pointerup',()=>lookOn=false);renderer.domElement.addEventListener('pointercancel',()=>lookOn=false);
// toss paper ball forward from camera
function throwPaper(){if(paused)return;if(ammo<=0){show('Keine Papierkügelchen mehr!');return}ammo--;document.getElementById('ammo').textContent=ammo;suspicion=Math.min(100,suspicion+12);document.getElementById('sus').textContent=suspicion;let ball=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),mat(0xf2eee5));ball.position.copy(camera.position);let dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);ball.userData.vel=dir.multiplyScalar(9).add(new THREE.Vector3(0,2,0));scene.add(ball);balls.push(ball);show('Papierkügelchen geworfen!')}
document.getElementById('throw').addEventListener('pointerdown',e=>{e.preventDefault();throwPaper()});
function pause(){paused=!paused;document.getElementById('pausePanel').style.display=paused?'flex':'none'}document.getElementById('pause').onclick=pause;document.getElementById('resume').onclick=pause;document.getElementById('reset').onclick=()=>location.reload();
let elapsed=0;function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);if(!paused){elapsed+=dt;seconds=Math.max(0,seconds-dt);let mm=Math.floor(seconds/60),ss=Math.floor(seconds%60);document.getElementById('timer').textContent=`${mm}:${String(ss).padStart(2,'0')}`;
// player movement
let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));camera.position.addScaledVector(forward,moveY*dt*3.2);camera.position.addScaledVector(right,moveX*dt*3.2);camera.position.x=Math.max(-9.8,Math.min(9.8,camera.position.x));camera.position.z=Math.max(-8.2,Math.min(8.2,camera.position.z));camera.position.y=1.65;
// teacher patrols front aisle, turning toward player sometimes
let t=elapsed;teacher.position.x=1.5+Math.sin(t*.35)*2.5;teacher.position.z=-6.4+Math.sin(t*.18)*.7;teacher.rotation.y=Math.sin(t*.4)*.5;
balls.forEach((b,i)=>{b.position.addScaledVector(b.userData.vel,dt);b.userData.vel.y-=7*dt;if(b.position.y<.1){b.position.y=.1;b.userData.vel.y*= -.35;b.userData.vel.x*=.6;b.userData.vel.z*=.6}if(b.position.distanceTo(teacher.position)<.65){suspicion=Math.min(100,suspicion+22);document.getElementById('sus').textContent=suspicion;show('Der Lehrer bemerkt etwas! Verdacht steigt.');scene.remove(b);balls.splice(i,1)}});if(suspicion>=100)show('ERWISCHT! Verdacht 100% – starte neu.');if(seconds<=0)show('Klausur vorbei!')}renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.addEventListener('contextmenu',e=>e.preventDefault());})();
</script></body></html>
